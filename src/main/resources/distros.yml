# Roll weights per rarity (higher = more common).
rarity-weights:
  COMMON: 55
  RARE: 25
  EPIC: 12
  LEGENDARY: 6
  MYTHIC: 2

# Fusion recipes: two distro tokens crafted together (shaped, side by side)
# produce the result distro's token. Fusion runs a skill check — on fail one
# input token is destroyed instead.
fusions:
  - inputs: [ubuntu, debian]
    result: mint
  - inputs: [arch, mint]
    result: manjaro
  - inputs: [debian, alpine]
    result: kali
  - inputs: [ubuntu, gentoo]
    result: popos

