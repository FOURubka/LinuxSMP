# ProGuard rules for LinuxSMP.
#
# Only names the server resolves at runtime have to survive. Everything the server
# reaches through an object reference (listeners, commands, tasks) can be renamed.

-dontoptimize                 # renaming is the goal; optimisation only adds breakage risk
-dontshrink                   # every class here is reachable through Bukkit, not through main()
-dontnote
-dontwarn org.bukkit.**
-dontwarn net.milkbowl.vault.**
-dontwarn io.papermc.paper.**

# Bukkit finds listener methods by scanning for @EventHandler, and record/enum metadata
# is read by the JVM itself - dropping these attributes breaks both.
-keepattributes *Annotation*,Signature,Record,EnclosingMethod,InnerClasses

# plugin.yml names this class as `main`; Bukkit instantiates it by that exact string.
-keep public class com.rubka.linuxsmp.LinuxSMPPlugin {
    public <init>();
    public void onEnable();
    public void onDisable();
}

# Rarity is parsed straight out of distros.yml with valueOf(), so its constant names
# are data, not identifiers. Same for any other enum reaching config.
-keepclassmembers enum com.rubka.linuxsmp.** {
    <fields>;
    public static **[] values();
    public static ** valueOf(java.lang.String);
}
